# Üç kapı + K7 yüzey denetimi.
#
# Depoda bu dosyadan önce hiç CI yoktu: kurallar PLAN.md'de yazılıydı ve
# yalnızca elle bakılırsa görülüyordu. `PlayOptions<'a>` aylarca K7'yi ihlal
# etti çünkü kimse bakmadı (D-052).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Ağ testleri (D-043) ulaşamazsa kendini atlar. CI'da SoundCloud,
  # YouTube Music ve MusicBrainz gerçekten koşar; AcoustID anahtarsız olduğu
  # için atlanır. Eklentiler için makinede hiçbir şey kurulu olması gerekmez:
  # motor gömülü (QuickJS), yt-dlp'yi platform ikilisi olarak motor indirir
  # (D-069). Kırmızı yanan bir ağ testi "ulaşamadım" değil, "ulaşıp
  # beklenmeyeni aldım" demektir.
  RUST_BACKTRACE: 1

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # cpal ALSA'ya, Tauri kabuğu WebKitGTK'ya bağlanıyor. Bunlar olmadan
      # `--workspace` derlenmez.
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Üç kapı — CONTRIBUTING.md'deki sırayla. Biçim önce: en ucuzu.
      - name: Kapı 1 — fmt
        run: cargo fmt --all --check

      - name: Kapı 2 — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # K7 yüzey denetimi (tests/k7_surface.rs) bu kapının içinde koşar.
      #
      # `HEADSHELL_TEST_YTMUSIC_COOKIES`: YouTube veri merkezi adreslerine bot
      # duvarı çıkarıyor ve çerezsiz hiçbir akış çözülemiyor (D-061). Sır
      # yoksa değişken boş gelir ve o tek test kendini atlar — fork'lardan
      # gelen PR'lara secret verilmediği için bu normal koşum.
      - name: Kapı 3 — test
        run: cargo test --workspace
        env:
          HEADSHELL_TEST_YTMUSIC_COOKIES: ${{ secrets.YTMUSIC_COOKIES }}

  # Windows ve macOS'ta derleme + test (D-070).
  #
  # Kod bu işe kadar yalnızca Linux'ta sınanıyordu ve Windows'a özgü yolların
  # hiçbiri koşmamıştı: veri dizini (`%LOCALAPPDATA%`), `;` ile bölünen müzik
  # listesi, `cmd.exe` ile araç testleri, `.exe` uzantılı eserler, boş ortamda
  # `SystemRoot`. Hepsi `cfg(windows)` ya da çalışma anı dalı — Linux'ta
  # derlenmeleri bile garanti değildi. `fmt` platformdan bağımsız, burada
  # tekrarlanmıyor.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace
        env:
          HEADSHELL_TEST_YTMUSIC_COOKIES: ${{ secrets.YTMUSIC_COOKIES }}

  # Feature birleşmesi olmadan çekirdek tek başına temiz mi?
  #
  # `--workspace` koşumunda headshell-cli ve headshell, headshell-core'un audio/http-client
  # feature'larını açıyor ve varsayılan derlemedeki ölü kodu gizliyor. Mobil
  # (Faz 6) çekirdeği bu feature'lar olmadan derleyecek, o yüzden ayrı bakılır.
  #
  # Bu iş bir zamanlar kırmızıydı ve `continue-on-error` ile maskeliydi;
  # D-054'te düzeltildi ve **kapıya** dönüştü. Tek tek feature'lara da
  # bakılıyor: borcun biriktiği yer birleşim değil, tek başına açılan
  # feature'dı (`http-client` açık, `audio` kapalı gibi).
  core-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # `audio` feature'ı cpal üzerinden ALSA istiyor.
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Çekirdek tek başına (varsayılan feature'lar)
        run: cargo clippy -p headshell-core --all-targets -- -D warnings

      - name: Her feature tek tek
        run: |
          for f in audio http-client fingerprint render-png plugin-engine; do
            echo "::group::$f"
            cargo clippy -p headshell-core --all-targets --features "$f" -- -D warnings
            echo "::endgroup::"
          done

      - name: Hepsi birden
        run: cargo clippy -p headshell-core --all-targets --features audio,http-client,fingerprint,render-png,plugin-engine -- -D warnings
