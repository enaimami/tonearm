# Üç kapı + K7 yüzey denetimi.
#
# Depoda bu dosyadan önce hiç CI yoktu: kurallar PLAN.md'de yazılıydı ve
# yalnızca elle bakılırsa görülüyordu. `PlayOptions<'a>` aylarca K7'yi ihlal
# etti çünkü kimse bakmadı (D-052).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Ağ testleri (D-043) ulaşamazsa kendini atlar. CI'da SoundCloud ve
  # MusicBrainz gerçekten koşar; AcoustID anahtarsız, ytmusic yt-dlp'siz,
  # torznab yapılandırmasız oldukları için atlanır. Kırmızı yanan bir ağ
  # testi "ulaşamadım" değil, "ulaşıp beklenmeyeni aldım" demektir.
  RUST_BACKTRACE: 1

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # cpal ALSA'ya, Tauri kabuğu WebKitGTK'ya bağlanıyor. Bunlar olmadan
      # `--workspace` derlenmez.
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Üç kapı — CONTRIBUTING.md'deki sırayla. Biçim önce: en ucuzu.
      - name: Kapı 1 — fmt
        run: cargo fmt --all --check

      - name: Kapı 2 — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # K7 yüzey denetimi (tests/k7_surface.rs) bu kapının içinde koşar.
      - name: Kapı 3 — test
        run: cargo test --workspace

  # Feature birleşmesi olmadan çekirdek tek başına temiz mi?
  #
  # `--workspace` koşumunda tune-cli ve tune, tune-core'un audio/http-client
  # feature'larını açıyor ve varsayılan derlemedeki ölü kodu gizliyor. Mobil
  # (Faz 6) çekirdeği bu feature'lar olmadan derleyecek, o yüzden ayrı bakılır.
  #
  # Bugün bu iş **kırmızı**: net::network_err ve net::fake::last_request ölü,
  # playback/player.rs'te karşılanmayan bir lint beklentisi var. Bu yüzden
  # kapı değil, rapor — düzeltilince `continue-on-error` kaldırılmalı.
  core-alone:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Çekirdek tek başına (varsayılan feature'lar)
        run: cargo clippy -p tune-core --all-targets -- -D warnings
