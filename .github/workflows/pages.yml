# Tanıtım sayfası (D-068).
#
# Sayfa `docs/` klasöründe düz HTML olarak duruyor: üretici yok, npm yok,
# derleme adımı yok. Bu iş akışı yalnızca o klasörü olduğu gibi alıp
# GitHub Pages'e koyuyor.
#
# `configure-pages` adımı `enablement: true` ile koşuyor çünkü Pages'i
# depo ayarlarından elle açmak gerekmesin: iş akışının kendi `GITHUB_TOKEN`'ı
# ilk koşumda siteyi açıyor.
name: Sayfa

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım. Koşmakta olan bir dağıtım iptal edilmez —
# yarım yayımlanmış bir site, geç yayımlanmış bir siteden kötüdür.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
