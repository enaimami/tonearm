# Masaüstü paketleri (Faz 3 çıktısı, D-057).
#
# `bundle.active` bir süre `false`'tu ve bu şunu gizledi: ikonlar 103 baytlık
# bir yer tutucuydu, lisans dosyası paketlenmiyordu, `.desktop` girdisinin
# kategorisi yoktu. Paketlemeyi yalnızca yayın gününde denemek, bu üçünü de
# yayın gününde bulmak demekti.
#
# Bu yüzden iki tetik var:
#
#   * `push: tags: v*`  — yayın. Paketler taslak bir GitHub Release'e yüklenir.
#   * `workflow_dispatch` — elle. Etiket atmadan paketlemenin bozulmadığını
#     görmek için; çıktı yalnızca artifact olur.
#
# `pull_request`'te koşmuyor: paketleme ~10 dakika ve üç kapı (ci.yml) zaten
# her PR'da koşuyor. Kırılan paketleme bir sonraki elle koşumda ya da
# etiketten önce yakalanır.
name: Paketler

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hedef kitle Linux ağırlıklı (D-028) ve WebKitGTK üç motorun en
          # zayıfı — matrisin ilk satırı bu yüzden Linux.
          - os: ubuntu-24.04
            name: linux
          - os: macos-14
            name: macos
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cpal ALSA'ya, kabuk WebKitGTK'ya bağlanıyor; `librsvg` ve `patchelf`
      # AppImage paketleyicisinin istediği araçlar.
      - name: Sistem bağımlılıkları (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Sürüm tek yerde yaşıyor: `tauri.conf.json`'da `version` alanı **yok**,
      # Tauri onu `Cargo.toml`'dan okuyor. İki yerde yazılsaydı biri kayardı.
      - name: Paketle (deb + rpm)
        if: matrix.name == 'linux'
        run: cargo tauri build --config crates/tonearm/tauri.conf.json --bundles deb,rpm

      # AppImage ayrı adımda, çünkü araç zinciri host dağıtımına duyarlı:
      # linuxdeploy kendi (eski) `strip`'ini taşıyor ve yeni bir dağıtımın
      # `.relr.dyn` bölümlü kütüphanelerini tanımıyor. Ubuntu runner'da sorun
      # çıkmaz; Arch gibi yeni bir makinede yerel üretim düşer.
      #
      # Ayrı durmasının sebebi **maskelemek değil**: adım düşerse iş kırmızı
      # yanar. Ayrım yalnızca deb/rpm'in bir AppImage arızasıyla birlikte
      # kaybolmasını engelliyor (artifact adımı `always()` ile koşuyor).
      - name: Paketle (AppImage)
        if: matrix.name == 'linux'
        run: cargo tauri build --config crates/tonearm/tauri.conf.json --bundles appimage

      - name: Paketle
        if: matrix.name != 'linux'
        run: cargo tauri build --config crates/tonearm/tauri.conf.json

      - name: Paketleri yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tonearm-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  # Paketler tamamlandıktan sonra **taslak** bir sürüm açılır. Taslak, çünkü
  # yayın metnini ve neyin gerçekten çıkacağını insan onaylar.
  draft:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Taslak sürüm
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: packages/**/*
