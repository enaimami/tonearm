[workspace]
resolver = "2"
members = [
    "crates/tonearm-core",
    "crates/tonearm-cli",
    "crates/tonearm",
    # D-047: torrent sağlayıcı workspace üyesi ama **çekirdeğin bağımlılığı
    # değil** — ayrı bir ikili, alt süreç olarak konuşuyor. `librqbit`'in
    # 179 crate'i buradan kilide girer, `tonearm-core`'un ağacına girmez.
    "crates/tonearm-plugin-torrent",
]
exclude = ["spike"]

[workspace.package]
# D-005: lisans MIT OR Apache-2.0 olarak karara bağlandı.
version = "0.0.1-beta"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tonearm-core = { path = "crates/tonearm-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Altın Kural ve tanılama kültürünün derleyici tarafından zorlanan kısmı.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
