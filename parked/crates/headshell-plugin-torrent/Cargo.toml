[package]
name = "headshell-plugin-torrent"
description = "The torrent provider plugin: searches Torznab, streams sequentially with librqbit. A subprocess (D-047)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# To carry `librqbit` errors with their chain of causes; the plugin does not use
# `headshell-core`'s `thiserror` types either (those are the core's contract).
anyhow = "1.0"

# The protocol types. The plugin uses the core's *library*, but the core does
# not use the plugin — the dependency goes one way. So the wire format is not
# written twice: when both sides share the same `serde` derives, drift is not
# possible. No features: only `plugin::protocol` and `provider::AudioSource` are
# needed, not audio/HTTP/fingerprinting.
headshell-core = { path = "../headshell-core", default-features = false }

# D-047: the torrent engine. `rust-tls` so it does not look for OpenSSL on the system.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }

# Requests to Torznab. `librqbit` already brings the same version.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
# Torznab's RSS. A read-only DOM: less state than a streaming parser, and so fewer
# silent errors. Already in the lock file through resvg.
roxmltree = "0.20"

# For the token in the local stream address. `librqbit` already brings the same version.
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
tracing = "0.1.44"
# stdout is **only** protocol lines; every log record goes to stderr. The core
# forwards the plugin's stderr into `tracing` (transport.rs), so librqbit's
# "no peers / the tracker does not answer" diagnosis reaches `headshell diag`.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[lints]
workspace = true
