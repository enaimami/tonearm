<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>headshell — GO/NO-GO</title>
<style>
  :root { --bg:#12111a; --fg:#e8e6f0; --dim:#8a86a0; --accent:#7c5cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  #wrap { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }

  /* TWO SEPARATE CSS SETS are measured — "WebKitGTK is slow" and "this CSS is
     expensive" are different claims, and §3.3's theme contract has to know
     exactly this difference.

     .anim-ok    → only transform and opacity. Stays on the compositor,
                   needs no layout/paint on every frame.
     .anim-naive → what a theme author writes by instinct: height,
                   box-shadow, filter, background-position. All of them
                   trigger layout or paint on every frame. */
  header { padding:10px 14px; border-bottom:1px solid #262336;
           background:linear-gradient(90deg,#1b1826,#2a2140,#1b1826);
           background-size:300% 100%; }
  .anim-naive header { animation: slide 6s linear infinite; }
  @keyframes slide { to { background-position:300% 0; } }
  .anim-ok header { animation: dim 6s linear infinite alternate; }
  @keyframes dim { to { opacity:.72; } }

  #eq { display:flex; gap:3px; align-items:flex-end; height:22px; margin-top:6px; }
  #eq i { width:4px; background:var(--accent); border-radius:2px; height:20%;
          transform-origin:bottom; }
  .anim-naive #eq i { box-shadow:0 0 6px var(--accent);
                    animation: bounce .9s ease-in-out infinite alternate; }
  @keyframes bounce { to { height:100%; filter:hue-rotate(90deg); } }
  .anim-ok #eq i { animation: bounce-t .9s ease-in-out infinite alternate; }
  @keyframes bounce-t { to { transform: scaleY(5); } }

  #list { overflow-y:scroll; position:relative; will-change:transform; }
  #spacer { position:relative; }
  .row { position:absolute; left:0; right:0; height:36px; display:flex;
         align-items:center; gap:12px; padding:0 14px;
         border-bottom:1px solid #1e1b2b; }
  .row .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .a, .row .d { color:var(--dim); font-variant-numeric:tabular-nums; }
  .row .a { width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .d { width:56px; text-align:right; }
  .anim-ok .row:nth-child(3n) .t { animation: fade 2s ease-in-out infinite alternate; }
  @keyframes fade { to { opacity:.55; } }
  .anim-naive .row:nth-child(3n) .t { animation: glow 2s ease-in-out infinite alternate; }
  @keyframes glow { to { text-shadow:0 0 8px var(--accent); color:#fff; } }

  footer { padding:8px 14px; border-top:1px solid #262336; color:var(--dim);
           font-variant-numeric:tabular-nums; white-space:pre; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <b>headshell — WebKitGTK GO/NO-GO</b>
    <div id="eq"></div>
  </header>
  <div id="list"><div id="spacer"></div></div>
  <footer id="log">preparing…</footer>
</div>

<script>
const N        = 50000;   // PLAN §3.1: 50,000 rows
const ROW_H    = 36;
const OVERSCAN = 6;

const listEl   = document.getElementById('list');
const spacerEl = document.getElementById('spacer');
const logEl    = document.getElementById('log');
const wrapEl   = document.getElementById('wrap');
const eqEl     = document.getElementById('eq');

for (let i = 0; i < 24; i++) eqEl.appendChild(document.createElement('i'));

// --- data: 50k real objects (so memory is part of the measurement) -------
const rows = new Array(N);
for (let i = 0; i < N; i++) {
  rows[i] = { id:i, title:`Track ${i} — this could be a rather long title`,
              artist:`Artist ${i % 997}`, ms: 120000 + (i % 240000) };
}
spacerEl.style.height = (N * ROW_H) + 'px';

// --- virtualisation: a node pool, not innerHTML ---------------------------
const pool = [];
function nodeFor(k) {
  while (pool.length <= k) {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = '<span class="t"></span><span class="a"></span><span class="d"></span>';
    spacerEl.appendChild(el);
    pool.push({ el, t:el.children[0], a:el.children[1], d:el.children[2], idx:-1 });
  }
  return pool[k];
}
function mmss(ms) {
  const s = Math.round(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
let lastFirst = -1, lastCount = -1;
function render() {
  const h     = listEl.clientHeight;
  const first = Math.max(0, Math.floor(listEl.scrollTop / ROW_H) - OVERSCAN);
  const count = Math.min(N - first, Math.ceil(h / ROW_H) + OVERSCAN * 2);
  if (first === lastFirst && count === lastCount) return;
  lastFirst = first; lastCount = count;
  for (let k = 0; k < count; k++) {
    const n = nodeFor(k), i = first + k, r = rows[i];
    if (n.idx !== i) {
      n.t.textContent = r.title;
      n.a.textContent = r.artist;
      n.d.textContent = mmss(r.ms);
      n.idx = i;
    }
    n.el.style.transform = `translateY(${i * ROW_H}px)`;
    n.el.style.display = '';
  }
  for (let k = count; k < pool.length; k++) pool[k].el.style.display = 'none';
}

// --- the measurement core ------------------------------------------------
const pct = (arr, p) => arr.length ? arr.slice().sort((x,y)=>x-y)[
  Math.min(arr.length-1, Math.floor(arr.length*p))] : 0;

function phase(name, ms, opts = {}) {
  return new Promise(res => {
    // If rAF stops (the window is hidden/throttled) the phase never ends and the
    // measurement hangs. This guard tells "could not measure" apart from a silent wait.
    let done = false;
    const finish = v => { if (!done) { done = true; clearTimeout(guard); res(v); } };
    const guard = setTimeout(() => {
      finish({ name, rAF_stopped: true, frame_count: frames.length });
    }, ms + 8000);
    const frames = [];
    let prev = performance.now(), t0 = prev, vel = opts.scroll ? 42 : 0, dir = 1;
    let ipcTimer = null, ipcSent = 0, ipcDone = 0;
    if (opts.ipcHz) {
      ipcTimer = setInterval(async () => {
        ipcSent++;
        await window.__TAURI__.core.invoke('anchor', { track: 7, positionMs: ipcSent * 33 });
        ipcDone++;
      }, Math.round(1000 / opts.ipcHz));
    }
    function step(now) {
      frames.push(now - prev); prev = now;
      if (vel) {
        let top = listEl.scrollTop + vel * dir;
        const max = N * ROW_H - listEl.clientHeight;
        if (top >= max) { top = max; dir = -1; } else if (top <= 0) { top = 0; dir = 1; }
        listEl.scrollTop = top;
        render();
      }
      if (now - t0 < ms) requestAnimationFrame(step);
      else {
        if (ipcTimer) clearInterval(ipcTimer);
        frames.shift(); // the first frame carries the phase transition
        finish({ name,
              fps_median:   +(1000 / pct(frames, .50)).toFixed(1),
              frame_p50_ms: +pct(frames, .50).toFixed(2),
              frame_p95_ms: +pct(frames, .95).toFixed(2),
              frame_worst_ms: +Math.max(...frames).toFixed(2),
              dropped_frames: frames.filter(f => f > 33.4).length,
              frame_count: frames.length,
              ipc_sent: ipcSent, ipc_done: ipcDone });
      }
    }
    requestAnimationFrame(step);
  });
}

// Write it on screen and to run.log too: if it hangs, the step it hung at shows.
const say = t => {
  logEl.textContent = t;
  if (window.__TAURI__) window.__TAURI__.core.invoke('mark', { msg: t });
  else console.log('STEP: ' + t);
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

// CONTROL MODE: so the same page can run in a plain browser too.
// One source, two engines — had I written a separate copy, the comparison would be meaningless.
// Without Tauri the IPC phases are skipped and the report is sent back over HTTP.
const TAURI = !!window.__TAURI__;

async function run() {
  const invoke = TAURI ? window.__TAURI__.core.invoke
                       : async () => { throw new Error('control mode'); };
  const listen = TAURI ? window.__TAURI__.event.listen : null;
  const report = { engine: TAURI ? 'webkitgtk (tauri)' : 'control browser',
                   agent: navigator.userAgent, rows: N, phases: [] };

  // The report is written **incrementally**: if a later step hangs, the numbers
  // of the earlier ones must not be lost. We lost exactly that on the first run.
  const save = () => {
    const json = JSON.stringify(report, null, 2);
    return TAURI ? invoke('save_report', { json })
                 : fetch('/report', { method:'POST', body: json }).catch(() => {});
  };

  render();
  await sleep(600); // let the first paint settle

  say('1/8 idle…');
  report.phases.push(await phase('idle', 2000));
  await save();

  say('2/8 scrolling…');
  report.phases.push(await phase('scroll', 5000, { scroll:true }));
  await save();

  say('3/8 scrolling + disciplined CSS…');
  wrapEl.className = 'anim-ok';
  report.phases.push(await phase('scroll+css_disciplined', 5000, { scroll:true }));
  await save();

  say('4/8 scrolling + naive CSS…');
  wrapEl.className = 'anim-naive';
  report.phases.push(await phase('scroll+css_naive', 5000, { scroll:true }));
  await save();

  wrapEl.className = '';
  await save();

  // There is no such thing as IPC in control mode — it stops here. What is
  // compared is the engine's drawing ceiling anyway, not Tauri's bridge.
  if (!TAURI) {
    report.done = true;
    say('the control run is done');
    await save();
    return;
  }

  say('5/8 scrolling + disciplined CSS + IPC 30 Hz…');
  wrapEl.className = 'anim-ok';
  report.phases.push(await phase('scroll+css_disciplined+ipc30', 5000,
                                { scroll:true, ipcHz:30 }));
  wrapEl.className = '';
  await save();

  say('6/8 IPC round trip…');
  const lat = [];
  for (let i = 0; i < 1000; i++) {
    const t = performance.now();
    await invoke('ping', { seq: i });
    lat.push(performance.now() - t);
  }
  report.ipc_round_trip_ms = { p50:+pct(lat,.50).toFixed(3), p95:+pct(lat,.95).toFixed(3),
                               p99:+pct(lat,.99).toFixed(3), worst:+Math.max(...lat).toFixed(3),
                               samples: lat.length };
  await save();

  say('7/8 IPC load (200 rows × 50)…');
  const pay = [];
  for (let i = 0; i < 50; i++) {
    const t = performance.now();
    const r = await invoke('page', { offset: i * 200, limit: 200 });
    pay.push(performance.now() - t);
    if (r.length !== 200) report.error = 'wrong page size';
  }
  report.ipc_page_200_ms = { p50:+pct(pay,.50).toFixed(2), p95:+pct(pay,.95).toFixed(2),
                             worst:+Math.max(...pay).toFixed(2) };

  report.ipc_page_200_ms.total_rows = 50 * 200;
  await save();

  // In steps. On the first run a single shot of 10,000 flooded the main thread so
  // badly that even the phase's own `setTimeout` timeout could not run — the
  // measurement hung. To find the ceiling it goes from small to large; each step
  // is written separately.
  report.event_stream = [];
  for (const BURST of [100, 500, 2000]) {
    say(`8/8 event stream ${BURST}…`);
    // If `listen` is refused (no capability permission), the error is swallowed
    // inside the async executor and the measurement hangs silently — exactly what
    // happened on the first run. Now it blows up.
    const un = await listen('tick', onTick);
    let n = 0, t0 = 0, settle;
    function onTick() {
      if (n === 0) t0 = performance.now();
      if (++n >= BURST) settle(performance.now() - t0);
    }
    const got = await new Promise(res => {
      settle = res;
      invoke('emit_burst', { count: BURST }).catch(e => res(-1));
    });
    un();
    report.event_stream.push({ count: BURST, ms: +got.toFixed(1),
                               events_per_s: Math.round(BURST / (got / 1000)) });
    await save();
    await sleep(400); // let the queue drain so the steps do not mix
  }

  if (performance.memory) report.js_heap_mb = +(performance.memory.usedJSHeapSize/1048576).toFixed(1);

  report.done = true;
  say('done');
  await save();
  await invoke('quit');
}

addEventListener('DOMContentLoaded', () => {
  say('0/8 JS is running, 50k rows built' + (TAURI ? '' : ' (CONTROL MODE)'));
  run().catch(async e => {
    // Do not swallow the error: the step it blew up at must show in run.log/the console.
    say('ERROR: ' + e);
    if (TAURI) await window.__TAURI__.core.invoke('quit');
  });
});
</script>
</body>
</html>
