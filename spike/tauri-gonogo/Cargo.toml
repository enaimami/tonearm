# The PLAN §3.1 GO/NO-GO measurement — THROWAWAY.
# `spike/` is outside the workspace (the root Cargo.toml's `exclude`); no dependency
# here enters headshell-core's tree. Once the measurement is done this directory can
# be deleted; the only thing left should be the numbers in DECISIONS.md.
[package]
name = "tauri-gonogo"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Measure under real release conditions: a debug build's IPC numbers lie.
opt-level = 2
