# PLAN §3.1 GO/NO-GO ölçümü — ATILABILIR.
# `spike/` workspace dışıdır (kök Cargo.toml `exclude`); buradaki hiçbir
# bağımlılık tune-core'un ağacına girmez. Ölçüm bitince bu dizin silinebilir,
# kalan tek şey DECISIONS.md'deki sayılar olmalı.
[package]
name = "tauri-gonogo"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Ölçümü gerçek yayın koşullarında yap: debug build'in IPC sayıları yalan söyler.
opt-level = 2
