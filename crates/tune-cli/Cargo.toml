[package]
name = "tune-cli"
description = "tune-core üzerine ince CLI kabuğu. İş mantığı içermez."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tune"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# D-011: `--out *.png` için PNG rasterizasyonu.
# D-016: `tune play` için ses hattı (symphonia + cpal).
tune-core = { workspace = true, features = ["render-png", "audio"] }

[lints]
workspace = true
