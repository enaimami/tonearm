[package]
name = "headshell-cli"
description = "headshell-core üzerine ince CLI kabuğu. İş mantığı içermez."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "headshell"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# D-011: `--out *.png` için PNG rasterizasyonu.
# D-016: `headshell play` için ses hattı (symphonia + cpal).
# D-020: uzak sağlayıcılar için HTTP istemcisi (ureq + rustls).
# D-046: `headshell resolve --file` için ses parmak izi (Chromaprint).
#   CLI her çekirdek yeteneğinin sınandığı yüzey (CLAUDE.md); parmak izi
#   feature'ının açık kalması gereken tek derleme burası. Ağacı büyütüyor ve
#   bedel bilerek ödeniyor — mobil ve sunucu derlemeleri onu taşımaz.
headshell-core = { workspace = true, features = [
    "render-png",
    "audio",
    "http-client",
    "fingerprint",
] }

[lints]
workspace = true
