[package]
name = "headshell-cli"
description = "The thin CLI shell on top of headshell-core. Contains no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "headshell"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# D-011: PNG rasterisation for `--out *.png`.
# D-016: the audio pipeline for `headshell play` (symphonia + cpal).
# D-020: the HTTP client for remote providers (ureq + rustls).
# D-069: the embedded JS engine for plugins (QuickJS).
# D-046: the audio fingerprint for `headshell resolve --file` (Chromaprint).
#   The CLI is the surface every core capability is tested through (CLAUDE.md);
#   this is the one build where the fingerprint feature has to stay on. It grows
#   the tree and the price is paid on purpose — mobile and server builds do not
#   carry it.
headshell-core = { workspace = true, features = [
    "render-png",
    "artwork-resize",
    "audio",
    "http-client",
    "fingerprint",
    "plugin-engine",
] }

[lints]
workspace = true
