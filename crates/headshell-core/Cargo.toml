[package]
name = "headshell-core"
description = "Sağlayıcıdan bağımsız dinleme kimliği çekirdeği. Bütün mantık burada."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = { version = "0.18", optional = true }
jiff = { version = "0.2.35", features = ["serde"] }
resvg = { version = "0.48", optional = true }
# D-069: eklenti motoru — gömülü QuickJS-NG. Ölçülen bedel **+4 crate**
# (51 → 55 benzersiz; `hashbrown`/`foldhash`/`equivalent` zaten ağaçtaydı)
# ve soyulmuş ikilide ~1,3 MB. Derleme C derleyicisi istiyor, ama `rusqlite`'ın
# `bundled`'ı onu zaten istiyor: yeni bir derleme gereksinimi yok. Varsayılan
# feature'lar kapalı: `std` dışında hiçbir şey (yükleyici, makrolar, async
# köprüsü) kullanılmıyor.
rquickjs = { version = "0.14", default-features = false, features = ["std"], optional = true }
rusty-chromaprint = { version = "0.3.0", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# D-055: motorun indirdiği eserin karmasını doğrulamak için. Ölçülen bedel
# **+8 crate** (51 → 59 benzersiz) ve bu ağaç mobile gidiyor. Feature
# kapısının arkasına konmadı: kapalı bir kapı, "karma tutmuyor" tanısını
# koyamamak demekti ve bu tanının susması tam da doğrulamanın var olma
# sebebini yok ederdi. `0.10` seçildi (0.11 değil) — Tauri kabuğu zaten
# 0.10.9'u kilitliyor, workspace'te ikinci bir kopya olmuyor.
sha2 = "0.10"
strsim = "0.11.1"
symphonia = { version = "0.6", features = ["mp3", "flac", "vorbis", "isomp4", "aac"], optional = true }
thiserror = "2.0.20"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
tracing = "0.1.44"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# D-070 — BSD'ler: DENENMEDİ (canary). `rquickjs-sys` FreeBSD, NetBSD, OpenBSD
# ve DragonFly için hazır bağlama taşımıyor; orada bağlama derleme anında
# libclang ile üretilir (`bindgen`). Aynı bağımlılık yalnızca bu hedeflerde bu
# özellikle bir kez daha yazılıyor, Cargo ikisini birleştiriyor: Linux, macOS
# ve Windows derlemesi değişmiyor, bu hedeflerde `libclang` kurulu olmalı.
# Buradan derlenip sınanamadı — BSD makinesi yok; belgelerde öyle yazar.
[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }

# Eklenti testleri motoru çalıştırıyor; motor kapalı bir derlemede (tek
# başına `cargo test -p headshell-core`) derlenmezler. Kapı koşumu
# `--workspace` olduğu için orada her zaman koşarlar (CLI feature'ı açıyor).
[[test]]
name = "plugin_script"
required-features = ["plugin-engine"]

[[test]]
name = "plugin_soundcloud"
required-features = ["plugin-engine", "http-client"]

[[test]]
name = "plugin_ytmusic"
required-features = ["plugin-engine", "http-client"]

# Elle çalıştırılan çalma denemesi; ses aygıtı ister, CI'da koşmaz.
[[example]]
name = "playback_probe"
required-features = ["audio"]

# AcoustID'ye giden parmak izi dizesini gözle görmek için (D-046).
[[example]]
name = "fingerprint_probe"
required-features = ["fingerprint"]

# MusicBrainz aramasının aday kümesi koşumlar arası sabit mi (D-046 eki).
[[example]]
name = "mb_stability_probe"
required-features = ["http-client"]

[lints]
workspace = true

[features]
# D-011: PNG rasterizasyonu opsiyonel. Çekirdek her zaman SVG üretir;
# `render-png` açıkken `sleeve::render_png` derlenir. CLI açar, mobil açmaz.
render-png = ["dep:resvg"]

# D-016: ses hattı (symphonia çözme + cpal çıkış) tek feature arkasında.
# Kapalıyken `playback` modülünün trait'leri ve kuyruk mantığı yine derlenir;
# yalnızca gerçek ses çıkışı düşer. Böylece sunucu/mobil derlemeleri ALSA'ya
# bağlanmak zorunda kalmaz.
audio = ["dep:symphonia", "dep:cpal"]

# D-045: ses parmak izi (Chromaprint). `audio`'yu gerektiriyor çünkü PCM'i
# symphonia üretiyor; ayrı bir feature çünkü `rustfft` + `rubato` ağacını
# yalnızca parmak izi isteyen derlemeler taşısın. Kapalıyken zincirin 4.
# halkası düşer ve bu **söylenir**, sessizce atlanmaz (K9).
fingerprint = ["dep:rusty-chromaprint", "audio"]

# D-069: eklenti motoru (QuickJS). Kapalıyken eklentiler yine keşfedilir,
# listelenir, onaylanır ve eserleri kurulur — yalnızca **çalıştırılamazlar**,
# ve ilk çağrı bunu bir hatayla söyler: "bu derlemede eklenti motoru yok".
# CLI ve masaüstü açar. Kapısı var çünkü çekirdek eklentisiz de eksiksizdir
# (yerel dosya, Subsonic, istatistik, içe aktarma).
plugin-engine = ["dep:rquickjs"]

# D-020: HTTP taşıma katmanı. `net::HttpClient` trait'i her zaman derlenir;
# bu feature yalnızca somut istemciyi (ureq + rustls) getirir. Kapalıyken
# Subsonic/Jellyfin mantığı yine derlenir ve test edilebilir — çağıran kendi
# `Arc<dyn HttpClient>`'ını verirse çalışır da. CLI açar, mobil açmaz.
http-client = ["dep:ureq"]
