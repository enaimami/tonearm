<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>headshell could not start</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="startup-error.js"></script>
  </head>
  <!-- The startup error window (D-070). No core, no IPC: the text comes from
       the `#` part of the address, and this page only shows it. -->
  <body class="startup-error">
    <main class="content">
      <h2>headshell could not start</h2>
      <p class="hint">
        The app stopped at the stage below while starting. You can select and copy the
        text; paste it as it is when reporting a bug.
      </p>
      <pre id="startupError"></pre>
      <p class="hint">
        To move the data directory somewhere else, you can set the <code>HEADSHELL_DATA_DIR</code>
        environment variable.
      </p>
    </main>
  </body>
</html>
